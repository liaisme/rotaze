name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Get version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -tags with_openvpn,with_gvisor -ldflags="-s -w \
            -X 'github.com/rotaze/rotaze/internal/version.Version=${{ steps.version.outputs.version }}' \
            -X 'github.com/rotaze/rotaze/internal/version.GitCommit=${{ steps.version.outputs.commit }}' \
            -X 'github.com/rotaze/rotaze/internal/version.BuildDate=${{ steps.version.outputs.build_date }}' \
            -X 'github.com/rotaze/rotaze/internal/version.GoVersion=$(go version | cut -d' ' -f3)'" \
            -o rotaze-${{ steps.version.outputs.version }}-linux-amd64 ./cmd/rotaze

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -tags with_openvpn,with_gvisor -ldflags="-s -w \
            -X 'github.com/rotaze/rotaze/internal/version.Version=${{ steps.version.outputs.version }}' \
            -X 'github.com/rotaze/rotaze/internal/version.GitCommit=${{ steps.version.outputs.commit }}' \
            -X 'github.com/rotaze/rotaze/internal/version.BuildDate=${{ steps.version.outputs.build_date }}'" \
            -o rotaze-${{ steps.version.outputs.version }}-linux-arm64 ./cmd/rotaze

      - name: Build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -tags with_openvpn,with_gvisor -ldflags="-s -w \
            -X 'github.com/rotaze/rotaze/internal/version.Version=${{ steps.version.outputs.version }}' \
            -X 'github.com/rotaze/rotaze/internal/version.GitCommit=${{ steps.version.outputs.commit }}' \
            -X 'github.com/rotaze/rotaze/internal/version.BuildDate=${{ steps.version.outputs.build_date }}'" \
            -o rotaze-${{ steps.version.outputs.version }}-darwin-amd64 ./cmd/rotaze

      - name: Build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -tags with_openvpn,with_gvisor -ldflags="-s -w \
            -X 'github.com/rotaze/rotaze/internal/version.Version=${{ steps.version.outputs.version }}' \
            -X 'github.com/rotaze/rotaze/internal/version.GitCommit=${{ steps.version.outputs.commit }}' \
            -X 'github.com/rotaze/rotaze/internal/version.BuildDate=${{ steps.version.outputs.build_date }}'" \
            -o rotaze-${{ steps.version.outputs.version }}-darwin-arm64 ./cmd/rotaze

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -tags with_openvpn,with_gvisor -ldflags="-s -w \
            -X 'github.com/rotaze/rotaze/internal/version.Version=${{ steps.version.outputs.version }}' \
            -X 'github.com/rotaze/rotaze/internal/version.GitCommit=${{ steps.version.outputs.commit }}' \
            -X 'github.com/rotaze/rotaze/internal/version.BuildDate=${{ steps.version.outputs.build_date }}'" \
            -o rotaze-${{ steps.version.outputs.version }}-windows-amd64.exe ./cmd/rotaze

      - name: Generate checksums
        run: |
          sha256sum rotaze-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rotaze-*-linux-amd64
            rotaze-*-linux-arm64
            rotaze-*-darwin-amd64
            rotaze-*-darwin-arm64
            rotaze-*-windows-amd64.exe
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
